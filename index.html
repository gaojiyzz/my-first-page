<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            width: 300px;
            height: 500px;
        }
        .box{
            display: grid;
            margin: 0 auto;
            width: 1000px;
            height: 500px;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr;
            justify-content: space-around;
            align-items:space-around;
            border: 1px solid black;
            background-color: pink;
        }
        .introduce{
            border: 1px solid black;
            background-color: rgb(184, 139, 147);
        }
    </style>
</head>
<body>
    <div class="box">
        <div><img src="./图片/报名照片.jpg" alt="最帅的振哥" title="最帅的振哥"></div>
        <div class="introduce">
            <p>姓名：杨振振</p>
            <p>性别：男</p>
            <p>平常喜欢健身、打排球，现在在自学编程。</p>
        </div>
    </div>
    
</body>
</html>
